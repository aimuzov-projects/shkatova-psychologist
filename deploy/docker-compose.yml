# Сайт на сервере projects. Порты 80/443 держит общий Caddy из aimuzov-projects/server-infra,
# он проксирует домен сюда по сети edge.

name: shkatova-site

services:
  site:
    build:
      context: ..
    image: shkatova-site
    container_name: shkatova-site
    restart: unless-stopped
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

networks:
  edge:
    name: edge
    external: true
