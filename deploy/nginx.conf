# nginx внутри контейнера shkatova-site. TLS, сжатие и домен держит Caddy проекта skator,
# сюда запросы приходят по сети skator_default уже расшифрованными.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # За прокси абсолютный редирект ушёл бы на http://shkatova-site, отдаём относительный.
    absolute_redirect off;

    # Хэшированные ассеты Astro неизменяемы, кешируем навсегда.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
