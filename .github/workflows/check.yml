name: Check

# На main проверки зовёт деплой перед выкладкой, отдельный прогон там был бы вторым.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Сборке нужен контактный телефон, номер здесь подставной.
      - uses: aimuzov-projects/infra-site-kit/check@v1
        env:
          CONTACT_PHONE: '79000000000'
