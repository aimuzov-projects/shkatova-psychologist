name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Выкладки идут по очереди, новая не обрывает уже начатую сборку.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://tatiana-shkatova.ru
    steps:
      # Сервер сам знает, что делать: ключ в authorized_keys привязан к deploy/remote.sh,
      # поэтому команду ssh не передаём.
      - name: Deploy on server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOST: '185.219.43.208 ssh-rsa '
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes root@185.219.43.208

      - name: Check site
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS -o /dev/null -w "%{http_code}\n" https://tatiana-shkatova.ru/ && exit 0
            sleep 5
          done
          exit 1
