name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Выкладки идут по очереди, новая не обрывает уже начатую сборку.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://tatiana-shkatova.ru
    steps:
      - uses: aimuzov-projects/infra-site-kit/deploy@v1
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://tatiana-shkatova.ru/
