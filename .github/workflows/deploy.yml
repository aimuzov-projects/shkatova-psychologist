name: Release

# Мерж в main только обновляет релизный PR. Мерж этого PR выпускает релиз,
# и уже релиз уезжает на сервер. Ручной запуск выкладывает любой релизный тег,
# например чтобы откатиться.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v1.2.0. Empty deploys the newest main.
        required: false

# Выкладки идут по очереди, новая не обрывает уже начатую сборку.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: aimuzov/.github/.github/workflows/release.yml@v1

  check:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/check.yml

  deploy:
    needs: [release, check]
    # `!cancelled()`, а не `always()`: job идёт и при пропущенных release и check
    # (ручной запуск), но отменённый прогон не деплоит.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://tatiana-shkatova.ru
    steps:
      - uses: aimuzov/infra-site-kit/deploy@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://tatiana-shkatova.ru/
          health-url: https://tatiana-shkatova.ru/api/health
          ref: ${{ needs.release.outputs.tag || inputs.tag }}
